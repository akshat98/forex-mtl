services:
  one-frame:
    image: paidyinc/one-frame:latest
    ports:
      - "8080:8080"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis-local-token}"]
    ports:
      - "6379:6379"

  forex-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - one-frame
      - redis
    environment:
      ONE_FRAME_BASE_URI: http://one-frame:8080
      ONE_FRAME_TOKEN_LOCAL: ${ONE_FRAME_TOKEN_LOCAL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-local-token}
    ports:
      - "8081:8080"
